name: Build SV MultiCam Replay Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.3'
        arch: 'win64_msvc2019_64'

    - name: Setup OBS Studio Prebuilt SDK
      shell: bash
      run: |
        curl -L -o obs-studio.zip https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip
        7z x obs-studio.zip -oobs-install
        git clone --depth 1 --branch 30.2.3 https://github.com/obsproject/obs-studio.git obs-src

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Plugin (Release)
      run: |
        cmake --build build --config Release

    - name: Upload Compiled Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: sv-multicam-replay-windows-x64
        path: build/Release/sv-multicam-replay.dll
