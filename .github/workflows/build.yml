name: Build SV MultiCam Replay Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Plugin Code
      uses: actions/checkout@v4

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        arch: 'win64_msvc2022_64'

    - name: Setup OBS Studio Prebuilt SDK
      shell: pwsh
      run: |
        curl.exe -L -o obs-studio.zip https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip
        7z.exe x obs-studio.zip -oobs-install
        git clone --depth 1 --branch 30.2.3 https://github.com/obsproject/obs-studio.git obs-src

        # Generate import library obs.lib from obs.dll
        "EXPORTS" | Out-File -Encoding ascii obs.def
        $obsExports = dumpbin /exports obs-install/bin/64bit/obs.dll
        foreach ($line in $obsExports) {
            if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $matches[1] | Out-File -Append -Encoding ascii obs.def
            }
        }
        lib.exe /def:obs.def /out:obs-install/bin/64bit/obs.lib /machine:x64

        # Generate import library obs-frontend-api.lib from obs-frontend-api.dll
        "EXPORTS" | Out-File -Encoding ascii obs-frontend-api.def
        $frontendExports = dumpbin /exports obs-install/bin/64bit/obs-frontend-api.dll
        foreach ($line in $frontendExports) {
            if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") {
                $matches[1] | Out-File -Append -Encoding ascii obs-frontend-api.def
            }
        }
        lib.exe /def:obs-frontend-api.def /out:obs-install/bin/64bit/obs-frontend-api.lib /machine:x64

    - name: Configure CMake
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin (Release)
      run: |
        cmake --build build

    - name: Upload Compiled Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: sv-multicam-replay-windows-x64
        path: build/**/sv-multicam-replay.dll
